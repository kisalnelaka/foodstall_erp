services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sumiyuru-erp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      - sumiyuru-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Automatic HTTPS Reverse Proxy via Caddy (Optional - uncomment when domain is pointed)
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: sumiyuru-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     - app

volumes:
  sumiyuru-data:
    name: sumiyuru-data
